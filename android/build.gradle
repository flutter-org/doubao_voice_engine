group 'com.volcengine.doubao_voice_engine'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url "https://artifact.bytedance.com/repository/Volcengine/"
        }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'com.volcengine.doubao_voice_engine'
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdk 19
    }

    dependencies {
        // 豆包语音引擎 SDK
        implementation 'com.bytedance.speechengine:speechengine_tob:0.0.14.7'

        // 网络库（0.0.14+ 无需 TTNet，改为 OkHttp）
        implementation("com.squareup.okhttp3:okhttp:4.9.1")
    }
}
